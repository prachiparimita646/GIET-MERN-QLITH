<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Card UI</title>
  <style>
    body {
      background: #ddd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    
    .card {
      width: 300px;
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    
    .card-image {
      background: #a5d6a7;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
    }
    
    .card-content {
      padding: 20px;
    }
    
    .label {
      background: #ccc;
      padding: 5px 10px;
      border-radius: 10px;
      font-size: 12px;
    }
    
    h2 {
      margin: 10px 0;
    }
    
    p {
      color: #666;
      font-size: 14px;
    }
    
    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(to right, #4a6cf7, #6a8cff);
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-image">Image</div>

    <div class="card-content">
      <span class="label">Label</span>
      <h2>Heading</h2>
      <p>This is a short description about the card.</p>
      <button>Action</button>
    </div>
  </div>

</body>
</html>
